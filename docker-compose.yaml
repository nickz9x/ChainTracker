      DISCORD_WEBHOOK_URL: https://discord.com/api/webhooks/1559358783208038461/la3NZXhmK0zYa-VGRO4qqZz-aALZ5xQJj28TICL26gqhl3j_1DCKYmGlC8l1G1ZuR0Jn
    networks:
      - chaintracker-network

  portfolio-service:
    build: C:\Users\nicho\OneDrive\Documentos\ChatGPT\portfolioService
    ports:
      - "3004:3004"
    networks:
      - chaintracker-network

  assetmarketdata-service:
    build: C:\Users\nicho\OneDrive\Documentos\ChatGPT\assetMarketDataService
    ports:
      - "3003:3003"
    environment:
      COINGECKO_KEY: CG-qjxKu4aBr8hkDD1DVWRgg8wG
      ALPACA_KEY: PK25OOHQUWHCUHF6YLFJUO7P2Q
      ALPACA_SECRET: DSHSTNNV5nT6MTQR6XqKDzmTDXL6kq6s7qdMgRRcWNny
    networks:
      - chaintracker-network

  gateway:
    build: C:\Users\nicho\OneDrive\Documentos\ChatGPT\gatewayService
    container_name: chaintracker-gateway
    ports:
      - "3006:3006"
    environment:
      SERVER_PORT: 3006
    networks:
      - chaintracker-network

  identity-service-db:
    image: postgres:17
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: identityService
    volumes:
      - identityService:/var/lib/postgresql/data
    networks:
      - chaintracker-network

  assetData-service-db:
    image: postgres:17
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: assetDataService
    volumes:
      - assetDataService:/var/lib/postgresql/data
    networks:
      - chaintracker-network

  portfolioService-db:
    image: postgres:17
    ports:
      - 5434:5432
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolioService
    volumes:
      - portfolioService:/var/lib/postgresql/data
    networks:
      - chaintracker-network

  notificationService-db:
    image: postgres:17
    ports:
      - 5435:5432
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notificationService
    volumes:
      - notificationService:/var/lib/postgresql/data
    networks:
      - chaintracker-network

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - chaintracker-network
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list > /dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: chaintracker-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "false"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - chaintracker-network

  keycloak:
    image: quay.io/keycloak/keycloak:latest  # Corrigido para a imagem oficial atual
    ports:
      - "8081:8080"
    environment:
      KC_DB: postgres
      # CORRIGIDO: Alterado de 'postgres' para 'identity-service-db'
      KC_DB_URL: jdbc:postgresql://identity-service-db:5432/identityService
      KC_DB_USERNAME: user
      KC_DB_PASSWORD: postgres
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    command: start-dev --import-realm
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/ChainTracker-realm.json
    depends_on:
      - identity-service-db  # Garante que o banco suba primeiro
    networks:
      - chaintracker-network

  redis:
    image: redis:latest
    container_name: my-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --requirepass admin --appendonly yes
    networks:
      - chaintracker-network
    restart: unless-stopped
volumes:
  identityService:
  assetDataService:
  portfolioService:
  notificationService:
  kafka-data:
  redis-data:
    driver: local

networks:
  chaintracker-network: