version: '3.8'

services:
  identity-service:
    build: ./identity-service
    ports:
      - "3002:8080"
    environment:
      KEYCLOAK_SECRET: ${KEYCLOAK_SECRET:?defina KEYCLOAK_SECRET no .env}
    networks:
      - chaintracker-network
    depends_on:
      - identity-service-db
    restart: always


  notification-service:
    build: ./notificationService
    ports:
      - "3005:8086"
    environment:
      NOTIFICATION_CLIENT_SECRET: ${NOTIFICATION_CLIENT_SECRET:?defina NOTIFICATION_CLIENT_SECRET no .env}
      TELEGRAM_KEY: ${TELEGRAM_KEY:?defina TELEGRAM_KEY no .env}
      DISCORD_TOKEN: ${DISCORD_TOKEN:?defina DISCORD_TOKEN no .env}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:?defina DISCORD_WEBHOOK_URL no .env}
    networks:
      - chaintracker-network
    depends_on:
      - notification-service-db
    restart: always
  portfolio-service:
    build: ./portfolioService
    ports:
      - "3004:8087"
    networks:
      - chaintracker-network
    depends_on:
      - portfolio-service-db
    restart: always

  assetmarketdata-service:
    build: ./assetMarketDataService
    ports:
      - "3003:8082"
    environment:
      COINGECKO_KEY: ${COINGECKO_KEY:?defina COINGECKO_KEY no .env}
      ALPACA_KEY: ${ALPACA_KEY:?defina ALPACA_KEY no .env}
      ALPACA_SECRET: ${ALPACA_SECRET:?defina ALPACA_SECRET no .env}
    networks:
      - chaintracker-network
    depends_on:
      - assetData-service-db
    restart: always

  gateway:
    build: ./gatewayService
    container_name: chaintracker-gateway
    ports:
      - "3006:3006"
    environment:
      SERVER_PORT: 3006
    networks:
      - chaintracker-network
    depends_on:
      keycloak:
        condition: service_healthy
    restart: always

  identity-service-db:
    image: postgres:17
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: identityService
    volumes:
      - identityService:/var/lib/postgresql/data
    networks:
      - chaintracker-network

  assetData-service-db:
    image: postgres:17
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: assetDataService
    volumes:
      - assetDataService:/var/lib/postgresql/data
    networks:
      - chaintracker-network

  portfolio-service-db:
    image: postgres:17
    ports:
      - 5434:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: portfolioService
    volumes:
      - portfolioService:/var/lib/postgresql/data
    networks:
      - chaintracker-network

  notification-service-db:
    image: postgres:17
    ports:
      - 5435:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: notificationService
    volumes:
      - notificationService:/var/lib/postgresql/data
    networks:
      - chaintracker-network

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - chaintracker-network

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: chaintracker-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
    depends_on:
      - kafka
    networks:
      - chaintracker-network

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    ports:
      - "8081:8080"
    environment:
      KC_DB: postgres

      KC_DB_URL: jdbc:postgresql://identity-service-db:5432/identityService
      KC_DB_USERNAME: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?defina KC_BOOTSTRAP_ADMIN_USERNAME no .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?defina KC_BOOTSTRAP_ADMIN_PASSWORD no .env}
    command: start-dev --import-realm
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/ChainTracker-realm.json
    depends_on:
      - identity-service-db
    networks:
      - chaintracker-network
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: always

  redis:
    image: redis:latest
    container_name: my-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: "redis-server --requirepass ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env} --appendonly yes"
    networks:
      - chaintracker-network
    restart: unless-stopped
volumes:
  identityService:
  assetDataService:
  portfolioService:
  notificationService:
  kafka-data:
  redis-data:
    driver: local

networks:
  chaintracker-network: